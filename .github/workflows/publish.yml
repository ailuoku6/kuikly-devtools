# Publishes kuikly-devtools to npm.
#
# Trigger: git tag v<version> matching package.json, then push the tag.
# npm Trusted Publishing authenticates this workflow through GitHub OIDC.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires a recent npm client; Node 24 includes it.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      # prepack runs npm run build (instrumentor jar + panel) before packing
      - run: npm publish
